name: Actualizar y publicar
on:
  push:
    branches: [main]
  issues:
    types: [opened, reopened]
  workflow_dispatch:
    inputs:
      refresh_posters:
        description: Completar carteles de TMDB sin releer las carteleras
        type: boolean
        default: false
      build_only:
        description: Publicar la web con la cartelera ya guardada
        type: boolean
        default: false
      favorite_search:
        description: Buscar en todo TMDB para añadir favoritas
        type: string
        default: ''
      favorite_page:
        description: Página de resultados TMDB
        type: string
        default: '1'
      newsletter:
        description: Publicar una edición del boletín
        type: boolean
        default: false
  schedule:
    - cron: '17 6 * * *'
    - cron: '17 17 * * 4'
permissions:
  contents: write
  issues: write
  pages: write
  id-token: write
concurrency:
  group: pages-and-data
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name != 'issues' || (github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, 'Favoritas:'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/calendar.test.mjs tests/pwa.test.mjs tests/posters.test.mjs services/tmdb/*.test.mjs
      - name: Comprobar Worker sin desplegar
        if: github.event_name == 'push'
        run: npx --yes wrangler@4.160.1 deploy --dry-run --config services/tmdb/wrangler.jsonc --outdir "$RUNNER_TEMP/tmdb-worker"
      - name: Actualizar favoritas públicas
        if: github.event_name == 'issues' || (github.event_name == 'workflow_dispatch' && inputs.favorite_search != '')
        env:
          FAVORITE_SEARCH: ${{ inputs.favorite_search }}
          FAVORITE_PAGE: ${{ inputs.favorite_page }}
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
        run: python -m src.favorites
      - name: Leer fuentes y construir
        env:
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
          FAVORITE_SEARCH: ${{ inputs.favorite_search }}
          PUBLISH_NEWSLETTER: ${{ inputs.newsletter || github.event.schedule == '17 17 * * 4' }}
          BUILD_ONLY: ${{ inputs.build_only }}
          REFRESH_POSTERS: ${{ inputs.refresh_posters }}
        run: |
          if [ "$REFRESH_POSTERS" = "true" ]; then
            python -m src.pipeline --posters-only
          elif [ "$GITHUB_EVENT_NAME" = "issues" ] || [ -n "$FAVORITE_SEARCH" ] || [ "$BUILD_ONLY" = "true" ]; then
            python -m src.pipeline --build-only
          elif [ "$PUBLISH_NEWSLETTER" = "true" ]; then
            python -m src.pipeline --newsletter
          else
            python -m src.pipeline
          fi
      - name: Guardar datos públicos
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data config/favorites.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar cartelera e incidencias"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Confirmar cambio publicado
        if: github.event_name == 'issues'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m src.favorites --respond
