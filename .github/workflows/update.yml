name: Actualizar y publicar
on:
  push:
    branches: [main]
  issues:
    types: [opened, reopened]
  workflow_dispatch:
    inputs:
      newsletter:
        description: Publicar una edición del boletín
        type: boolean
        default: false
  schedule:
    - cron: '17 6 * * *'
    - cron: '17 17 * * 4'
permissions:
  contents: write
  issues: write
  pages: write
  id-token: write
concurrency:
  group: pages-and-data
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name != 'issues' || (github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, 'Favoritas:'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/calendar.test.mjs tests/pwa.test.mjs
      - name: Actualizar favoritas públicas
        if: github.event_name == 'issues'
        env:
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
        run: python -m src.favorites
      - name: Leer fuentes y construir
        env:
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
          PUBLISH_NEWSLETTER: ${{ inputs.newsletter || github.event.schedule == '17 17 * * 4' }}
        run: |
          if [ "$PUBLISH_NEWSLETTER" = "true" ]; then
            python -m src.pipeline --newsletter
          else
            python -m src.pipeline
          fi
      - name: Guardar datos públicos
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data config/favorites.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar cartelera e incidencias"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Confirmar cambio publicado
        if: github.event_name == 'issues'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m src.favorites --respond
