name: Activar sugerencias TMDB
on:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages-and-data
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -q
      - run: node --test services/tmdb/*.test.mjs tests/calendar.test.mjs tests/pwa.test.mjs tests/posters.test.mjs
      - name: Desplegar y comprobar Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
          FAVORITES_OWNER_SECRET: ${{ secrets.FAVORITES_OWNER_SECRET }}
        run: python services/tmdb/deploy.py
      - run: python -m src.pipeline --build-only
      - name: Guardar conexión pública
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web/search-config.json data/public.json config/favorites.json
          if ! git diff --cached --quiet; then
            git commit -m "Conectar sugerencias instantáneas de TMDB"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
