name: Comprobar API de FilmAgenda
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Comprobar fechas y cobertura
        env:
          FILMAGENDA_API_KEY: ${{ secrets.FILMAGENDA_API_KEY }}
        run: python -m src.filmagenda
